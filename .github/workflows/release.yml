name: Release

on:
  push:
    branches: [main]
    paths:
      - "plugins/*/package.json"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate plugin translations before publication
        run: pnpm build:registry

      - name: Validate OSS secrets
        env:
          OSS_ENDPOINT: ${{ secrets.ALIYUN_COLAOS_OSS_ENDPOINT }}
          OSS_REGION: ${{ secrets.ALIYUN_COLAOS_OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_HAIWAI_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_HAIWAI_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.ALIYUN_COLAOS_OSS_BUCKET }}
          CN_OSS_ENDPOINT: ${{ vars.ALIYUN_COLA_CN_OSS_ENDPOINT }}
          CN_OSS_REGION: ${{ vars.ALIYUN_COLA_CN_OSS_REGION }}
          CN_OSS_BUCKET: ${{ vars.ALIYUN_COLA_CN_OSS_BUCKET }}
        run: |
          missing=()
          [ -n "$OSS_ENDPOINT" ] || missing+=(ALIYUN_COLAOS_OSS_ENDPOINT)
          [ -n "$OSS_REGION" ] || missing+=(ALIYUN_COLAOS_OSS_REGION)
          [ -n "$OSS_ACCESS_KEY_ID" ] || missing+=(ALIYUN_HAIWAI_ACCESS_KEY_ID)
          [ -n "$OSS_ACCESS_KEY_SECRET" ] || missing+=(ALIYUN_HAIWAI_ACCESS_KEY_SECRET)
          [ -n "$OSS_BUCKET" ] || missing+=(ALIYUN_COLAOS_OSS_BUCKET)
          [ -n "$CN_OSS_ENDPOINT" ] || missing+=("ALIYUN_COLA_CN_OSS_ENDPOINT (variable)")
          [ -n "$CN_OSS_REGION" ] || missing+=("ALIYUN_COLA_CN_OSS_REGION (variable)")
          [ -n "$CN_OSS_BUCKET" ] || missing+=("ALIYUN_COLA_CN_OSS_BUCKET (variable)")

          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing required Actions secrets/variables: ${missing[*]}"
            exit 1
          fi

      - name: Detect version changes
        id: versions
        run: |
          RELEASES=""
          BASE_SHA="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              BASE_SHA="HEAD~1"
            fi
          fi

          for dir in plugins/*/; do
            dir="${dir%/}"
            plugin=$(basename "$dir")
            pkg="$dir/package.json"
            [ -f "$pkg" ] || continue

            NEW_VER=$(node -p "require('./$pkg').version")

            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              # 手动触发:重发全部插件,忽略版本 diff
              RELEASES="$RELEASES $plugin:$NEW_VER"
              continue
            fi

            OLD_VER=""
            if git cat-file -e "$BASE_SHA:$pkg" 2>/dev/null; then
              OLD_VER=$(git show "$BASE_SHA:$pkg" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "")
            fi
            if [ "$NEW_VER" != "$OLD_VER" ]; then
              RELEASES="$RELEASES $plugin:$NEW_VER"
            fi
          done
          echo "releases=$RELEASES" >> "$GITHUB_OUTPUT"

      - name: Setup ossutil
        uses: ./.github/actions/setup-ossutil
        with:
          endpoint: ${{ secrets.ALIYUN_COLAOS_OSS_ENDPOINT }}
          region: ${{ secrets.ALIYUN_COLAOS_OSS_REGION }}
          access-key-id: ${{ secrets.ALIYUN_HAIWAI_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_HAIWAI_ACCESS_KEY_SECRET }}

      - name: Build & upload to OSS
        if: steps.versions.outputs.releases != ''
        env:
          OSS_BUCKET: ${{ secrets.ALIYUN_COLAOS_OSS_BUCKET }}
          CN_OSS_ENDPOINT: ${{ vars.ALIYUN_COLA_CN_OSS_ENDPOINT }}
          CN_OSS_REGION: ${{ vars.ALIYUN_COLA_CN_OSS_REGION }}
          CN_OSS_BUCKET: ${{ vars.ALIYUN_COLA_CN_OSS_BUCKET }}
        run: |
          # 国内桶禁止默认公网 endpoint;组织变量的 endpoint 是 meetcola.com,
          # 虚拟主机寻址拼成桶绑定的 CNAME meetcola-public-prod02.meetcola.com
          CN=(--endpoint "$CN_OSS_ENDPOINT" --region "$CN_OSS_REGION")

          for entry in ${{ steps.versions.outputs.releases }}; do
            plugin="${entry%%:*}"
            version="${entry##*:}"
            tarball="${plugin}-${version}.tar.gz"
            key="plugins/${plugin}/${tarball}"

            echo "=== Publishing $plugin@$version ==="

            # 版本不可变:两个桶各自已存在则不覆盖、不删除
            in_global=false; in_cn=false
            ossutil stat "oss://$OSS_BUCKET/$key" &>/dev/null && in_global=true
            ossutil stat "oss://$CN_OSS_BUCKET/$key" "${CN[@]}" &>/dev/null && in_cn=true
            if $in_global && $in_cn; then
              echo "$key already exists in both buckets, skipping"
              continue
            fi

            if $in_global; then
              # 已发布过的版本原样拷贝,保证两个桶字节一致
              ossutil cp -f "oss://$OSS_BUCKET/$key" "$tarball"
            elif $in_cn; then
              ossutil cp -f "oss://$CN_OSS_BUCKET/$key" "$tarball" "${CN[@]}"
            else
              pnpm --filter "./plugins/$plugin" run build

              # 打一个自包含目录(含 prod 依赖)
              staging="staging/$plugin"
              mkdir -p "$staging"
              cp "plugins/$plugin/package.json" "$staging/"
              if [ -f "plugins/$plugin/README.md" ]; then
                cp "plugins/$plugin/README.md" "$staging/"
              fi
              cp -r "plugins/$plugin/dist" "$staging/dist"
              pnpm exec tsx scripts/stage-plugin-locales.ts "plugins/$plugin" "$staging"
              (cd "$staging" && npm install --omit=dev --ignore-scripts)

              tar -czf "$tarball" -C "$staging" .
              rm -rf "$staging"
            fi

            if ! $in_global; then
              ossutil cp -f "$tarball" "oss://$OSS_BUCKET/$key" \
                --cache-control "max-age=31536000"
            fi
            if ! $in_cn; then
              ossutil cp -f "$tarball" "oss://$CN_OSS_BUCKET/$key" "${CN[@]}" \
                --cache-control "max-age=31536000"
            fi

            rm -f "$tarball"
          done

      - name: Rebuild & publish registry
        env:
          OSS_BUCKET: ${{ secrets.ALIYUN_COLAOS_OSS_BUCKET }}
          CN_OSS_ENDPOINT: ${{ vars.ALIYUN_COLA_CN_OSS_ENDPOINT }}
          CN_OSS_REGION: ${{ vars.ALIYUN_COLA_CN_OSS_REGION }}
          CN_OSS_BUCKET: ${{ vars.ALIYUN_COLA_CN_OSS_BUCKET }}
        run: |
          # 上传 manifest 到 OSS(短缓存,保证前端及时拿到新版本)
          # 老客户端读 files.colaos.ai,新客户端读 download.meetcola.com;下载地址各指向自己的域名
          OSS_PUBLIC_BASE=https://files.colaos.ai pnpm build:registry
          ossutil cp -f registry.json "oss://$OSS_BUCKET/plugins/registry.json" \
            --cache-control "no-cache"

          OSS_PUBLIC_BASE=https://download.meetcola.com pnpm build:registry
          ossutil cp -f registry.json "oss://$CN_OSS_BUCKET/plugins/registry.json" \
            --endpoint "$CN_OSS_ENDPOINT" --region "$CN_OSS_REGION" \
            --cache-control "no-cache"
